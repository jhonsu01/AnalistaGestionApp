# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# El daemon de Gradle se comunica consigo mismo por loopback. En equipos donde
# el hostname resuelve a una IPv6 link-local (fe80::...) y el archivo hosts no
# define "127.0.0.1 localhost", esa conexion falla antes de compilar con
# "Unable to establish loopback connection".
# Forzar la pila IPv4 y fijar la direccion del daemon lo resuelve sin tocar la
# configuracion de red del equipo.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djava.rmi.server.hostname=127.0.0.1
org.gradle.parallel=false
org.gradle.daemon=true
