<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Analista de Gestión Pública</title>
<link rel="icon" href="icono.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Barra superior: solo se ve en móvil, para abrir el historial -->
<header id="barra-movil">
  <button id="btn-menu" class="icono" aria-label="Abrir historial" aria-expanded="false">☰</button>
  <span class="titulo-movil">Analista de Gestión</span>
  <button id="btn-ajustes-movil" class="icono" aria-label="Ajustes">⚙</button>
</header>

<aside id="lateral" aria-label="Historial">
  <header class="lateral-cab">
    <h1>Consultas</h1>
    <div class="cab-acciones">
      <button id="btn-nueva" class="primario">+ Nueva</button>
      <button id="btn-cerrar-lateral" class="icono solo-movil" aria-label="Cerrar">✕</button>
    </div>
  </header>

  <div class="buscador">
    <input id="buscar-historial" type="search" placeholder="Buscar en el historial…"
           autocomplete="off" aria-label="Buscar en el historial">
  </div>

  <div class="filtros-rapidos">
    <button class="chip activo" data-filtro="todas">Todas</button>
    <button class="chip" data-filtro="fijadas">Fijadas</button>
    <button class="chip" data-filtro="favoritas">Favoritas</button>
  </div>

  <nav id="lista-historial"></nav>

  <footer class="lateral-pie">
    <button id="btn-ajustes" class="plano">Ajustes</button>
    <span id="version-app" class="tenue"></span>
  </footer>
</aside>

<div id="velo" hidden></div>

<main id="principal">
  <div id="barra-estado" class="aviso oculto" role="status"></div>

  <section id="zona-consulta">
    <form id="form-consulta" autocomplete="off">
      <textarea id="pregunta" rows="3" required
        placeholder="¿Qué quieres saber? Por ejemplo: ¿cuánto ejecutó el ICBF en 2024?"
        aria-label="Tu pregunta"></textarea>
      <button type="submit" id="btn-preguntar" class="primario grande">Consultar</button>
    </form>

    <!-- Filtros y sugerencias plegados: en móvil no deben comerse la pantalla -->
    <details id="caja-filtros" class="plegable">
      <summary>Filtros y opciones</summary>
      <div class="filtros">
        <select id="sel-sector" aria-label="Filtrar por sector">
          <option value="">Todos los sectores</option>
        </select>
        <select id="sel-entidad" aria-label="Filtrar por entidad">
          <option value="">Todas las entidades</option>
        </select>
        <label class="fragmentos">
          Fragmentos
          <input id="num-k" type="number" min="4" max="60" value="20">
        </label>
      </div>
    </details>

    <details id="caja-sugerencias" class="plegable">
      <summary>Ejemplos de consulta</summary>
      <div class="sugerencias">
        <button class="sugerencia">¿Cuánto ejecutó el ICBF y en qué?</button>
        <button class="sugerencia">Gastos de funcionamiento del Ministerio de Hacienda</button>
        <button class="sugerencia">Estado de la red vial según INVÍAS</button>
        <button class="sugerencia">Proyectos pendientes en Minas y Energía</button>
      </div>
    </details>
  </section>

  <section id="zona-respuesta" class="oculto">
    <article id="respuesta" aria-live="polite"></article>

    <div id="acciones" class="acciones oculto">
      <button id="btn-favorita" class="plano">☆ Favorita</button>
      <button id="btn-fijar" class="plano">Fijar</button>
      <button id="btn-escuchar" class="plano oculto">▶ Escuchar</button>
      <button id="btn-copiar" class="plano">Copiar</button>
      <button id="btn-exportar" class="plano">Exportar</button>
      <button id="btn-borrar" class="plano peligro">Eliminar</button>
    </div>

    <audio id="reproductor" class="oculto" controls preload="none"></audio>

    <details id="caja-fuentes" class="fuentes">
      <summary>Fuentes <span id="num-fuentes"></span></summary>
      <ol id="lista-fuentes"></ol>
    </details>
  </section>
</main>

<dialog id="dlg-ajustes">
  <form method="dialog" id="form-ajustes">
    <h2>Ajustes</h2>

    <label>Carpeta del corpus
      <input id="aj-corpus" type="text" placeholder="D:\...\data\rag" spellcheck="false">
      <small>Debe contener <code>embeddings.npy</code> y <code>metadatos.jsonl</code>.
      Los datos no viajan con la app.</small>
    </label>

    <label>Servidor de modelos
      <div class="fila">
        <input id="aj-url" type="text" placeholder="http://localhost:1234/v1" spellcheck="false">
        <button type="button" id="btn-buscar-modelos" class="plano">Buscar</button>
      </div>
      <small>LM Studio, Ollama o llama-server (API compatible con OpenAI).</small>
    </label>

    <label>Clave de API <span class="tenue">(si tu servidor la exige)</span>
      <input id="aj-clave" type="password" placeholder="opcional" autocomplete="off">
    </label>

    <label>Modelo de respuesta
      <select id="aj-modelo-sel"><option value="">— pulsa Buscar —</option></select>
      <input id="aj-modelo" type="text" placeholder="o escríbelo a mano" spellcheck="false">
    </label>

    <label>Modelo de embeddings
      <select id="aj-embed-sel"><option value="">— pulsa Buscar —</option></select>
      <input id="aj-embed" type="text" spellcheck="false">
      <small>Debe ser el MISMO con el que se generó el índice.</small>
    </label>

    <details class="plegable">
      <summary>Contexto y rendimiento</summary>
      <label>Tokens de respuesta
        <input id="aj-maxtok" type="number" min="1000" max="60000" step="500">
        <small>El modelo razona antes de responder y gasta de aquí. Si responde
        vacío, súbelo.</small>
      </label>
      <label>Contexto máximo de entrada (tokens)
        <input id="aj-ctx" type="number" min="4000" max="250000" step="1000">
        <small>Si los fragmentos no caben, se comprimen automáticamente.</small>
      </label>
      <label>Caracteres por fragmento
        <input id="aj-chars" type="number" min="500" max="12000" step="500">
      </label>
    </details>

    <details class="plegable">
      <summary>Lectura en voz alta</summary>
      <label>Voz
        <select id="aj-voz"><option value="">Sin lectura</option></select>
        <small id="aviso-voz">Las voces se descargan aparte, no vienen en el instalador.</small>
      </label>
    </details>

    <div id="diag-ajustes" class="diag"></div>

    <menu>
      <button value="cancel" class="plano">Cerrar</button>
      <button type="button" id="btn-probar" class="plano">Probar conexión</button>
      <button value="guardar" id="btn-guardar-ajustes" class="primario">Guardar</button>
    </menu>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
